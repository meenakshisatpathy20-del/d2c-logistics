# One-click Render setup: New -> Blueprint -> pick this repo.
# Creates the database and one web service (website + API), and redeploys
# automatically on every push to main.
databases:
  - name: d2c-logistics-db
    region: singapore
    plan: free

services:
  - type: web
    name: d2c-logistics
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: d2c-logistics-db
          property: connectionString
